<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Massas - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{max-width:700px;margin:auto;}

h1,h2{text-align:center;margin:20px 0;}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:20px;
}

.voltar{
display:block;
width:100%;
padding:18px;
margin-top:15px;
text-align:center;
border-radius:12px;
background:white;
color:#5B178A;
font-weight:600;
text-decoration:none;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

label:has(input:checked){
border:2px solid #00ff4c;
background:rgba(0,255,76,0.08);
}

#carrinho{
background:rgba(255,255,255,.12);
padding:10px;
border-radius:12px;
margin-top:10px;
}

.item{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
padding:5px 8px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🍝 MONTE SUA MASSA</h1>

<!-- PASSO 1 -->
<div class="bloco">
<h2>PASSO 1: ATENÇÃO AO PEDIDO</h2>
<label><input type="checkbox" class="extra" value="Alérgico"> Sou alérgico</label>
<label><input type="checkbox" class="extra" value="Camarão +10"> Adicional de camarão + R$10</label>
</div>

<!-- PASSO 2 -->
<div class="bloco">
<h2>PASSO 2: QUANTIDADE</h2>
<label><input type="radio" name="qtd" value="450G" data-preco="14.90"> 450G - R$14,90</label>
<label><input type="radio" name="qtd" value="900G" data-preco="27.90"> 900G - R$27,90</label>
</div>

<!-- PASSO 3 -->
<div class="bloco">
<h2>PASSO 3: MASSA</h2>
<label><input type="radio" name="massa" value="Espaguete"> Espaguete</label>
<label><input type="radio" name="massa" value="Fettuccine"> Fettuccine</label>
<label><input type="radio" name="massa" value="Penne"> Penne</label>
<label><input type="radio" name="massa" value="Parafuso"> Parafuso</label>
</div>

<!-- PASSO 4 -->
<div class="bloco">
<h2>PASSO 4: INGREDIENTES (ESCOLHA ATÉ 6 OPÇÕES)</h2>

<label><input type="checkbox" class="ing" value="Azeitona"> Azeitona</label>
<label><input type="checkbox" class="ing" value="Frango"> Frango</label>
<label><input type="checkbox" class="ing" value="Brócolis"> Brócolis</label>
<label><input type="checkbox" class="ing" value="Milho"> Milho</label>
<label><input type="checkbox" class="ing" value="Bacon"> Bacon</label>
<label><input type="checkbox" class="ing" value="Ovo de codorna"> Ovo de codorna</label>
<label><input type="checkbox" class="ing" value="Calabresa"> Calabresa</label>
<label><input type="checkbox" class="ing" value="Palmito"> Palmito</label>
<label><input type="checkbox" class="ing" value="Carne moída"> Carne moída</label>
<label><input type="checkbox" class="ing" value="Presunto"> Presunto</label>
<label><input type="checkbox" class="ing" value="Carne de sol"> Carne de sol</label>
<label><input type="checkbox" class="ing" value="Mussarela"> Mussarela</label>
<label><input type="checkbox" class="ing" value="Queijo coalho"> Queijo coalho</label>
<label><input type="checkbox" class="ing" value="Cebola"> Cebola</label>
<label><input type="checkbox" class="ing" value="Tomate"> Tomate</label>
<label><input type="checkbox" class="ing" value="Ervilha"> Ervilha</label>
<label><input type="checkbox" class="ing" value="Uva passas"> Uva passas</label>
<label><input type="checkbox" class="ing" value="Batata palha"> Batata palha</label>

</div>

<!-- PASSO 5 -->
<div class="bloco">
<h2>PASSO 5: MOLHOS (ATÉ 3)</h2>

<label><input type="checkbox" class="molho" value="Molho branco"> Molho branco</label>
<label><input type="checkbox" class="molho" value="Molho bolonhesa"> Molho bolonhesa</label>
<label><input type="checkbox" class="molho" value="Molho de tomate"> Molho de tomate</label>
<label><input type="checkbox" class="molho" value="Sem molho"> Sem molho</label>

</div>

<!-- PASSO 6 -->
<div class="bloco">
<h2>PASSO 6: FINALIZAÇÃO</h2>

<label><input type="checkbox" class="final" value="Cheiro verde"> Cheiro verde</label>
<label><input type="checkbox" class="final" value="Manjericão"> Manjericão</label>
<label><input type="checkbox" class="final" value="Orégano"> Orégano</label>
<label><input type="checkbox" class="final" value="Queijo ralado"> Queijo ralado</label>
<label><input type="checkbox" class="final" value="Pimenta calabresa"> Pimenta calabresa</label>

</div>

<!-- TURBINAR -->
<div class="bloco">
<h2>DESEJA TURBINAR?</h2>
<label><input type="radio" name="turbo" value="Sim +3" data-preco="3"> Sim (+R$3,00)</label>
<label><input type="radio" name="turbo" value="Não" data-preco="0"> Não</label>
</div>

<!-- CARRINHO -->
<div class="bloco">
<h2>🛒 CARRINHO</h2>
<div id="carrinho"></div>

<button class="botao" onclick="adicionarCarrinho()">➕ ADICIONAR</button>
<button class="botao" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>
<a class="voltar" href="javascript:history.back()">⬅ VOLTAR</a>
</div>

</div>

<script>

function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

function adicionarCarrinho(){

let qtd=document.querySelector('input[name="qtd"]:checked');
let massa=document.querySelector('input[name="massa"]:checked');
let turbo=document.querySelector('input[name="turbo"]:checked');

if(!qtd || !massa) return alert("Escolha quantidade e massa");

let extras=[...document.querySelectorAll('.extra:checked')].map(i=>i.value);
let ingredientes=[...document.querySelectorAll('.ing:checked')].map(i=>i.value);
let molhos=[...document.querySelectorAll('.molho:checked')].map(i=>i.value);
let final=[...document.querySelectorAll('.final:checked')].map(i=>i.value);

let preco=Number(qtd.dataset.preco || 0);
if(turbo && turbo.dataset.preco) preco+=Number(turbo.dataset.preco);

let item={
nome:`🍝 Massa ${qtd.value} - ${massa.value}
Extras: ${extras.join(", ")}
Ingredientes: ${ingredientes.join(", ")}
Molhos: ${molhos.join(", ")}
Final: ${final.join(", ")}`,
preco:preco
};

let carrinho=getCarrinho();
carrinho.push(item);

salvarCarrinho(carrinho);
renderCarrinho();
}

function renderCarrinho(){

let c=getCarrinho();
let div=document.getElementById("carrinho");

if(c.length===0) return div.innerHTML="Vazio";

div.innerHTML="";

c.forEach((i,index)=>{
div.innerHTML+=`
<div class="item">
<span>${i.nome} - R$ ${i.preco.toFixed(2)}</span>
<button class="remover" onclick="remover(${index})">X</button>
</div>`;
});
}

function remover(i){
let c=getCarrinho();
c.splice(i,1);
salvarCarrinho(c);
renderCarrinho();
}

function finalizarPedido(){

let carrinho = getCarrinho();

if(carrinho.length === 0){
alert("Carrinho vazio");
return;
}

let texto = "🛒 PEDIDO MASSAS%0A%0A";
let total = 0;

carrinho.forEach(i=>{
texto += i.nome;
texto += ` - R$ ${i.preco.toFixed(2)}%0A`;
total += i.preco;
});

texto += `%0ATOTAL: R$ ${total.toFixed(2)}`;

window.open(
"https://wa.me/5588999031455?text=" + texto,
"_blank"
);

/* LIMPA O CARRINHO */
localStorage.removeItem("carrinho");
renderCarrinho();

/* DESMARCA TODOS OS CAMPOS */
document.querySelectorAll("input").forEach(input=>{
input.checked = false;
});

/* ATUALIZA A TELA */
renderCarrinho();

alert("Pedido enviado com sucesso!");
}
</script>

</body>
</html></html></html>
