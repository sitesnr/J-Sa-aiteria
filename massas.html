<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Massas - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{max-width:700px;margin:auto;}

h1,h2{text-align:center;margin:20px 0;}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:20px;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

label:has(input:checked){
border:2px solid #00ff4c;
background:rgba(0,255,76,0.08);
}

#carrinho{
background:rgba(255,255,255,.12);
padding:10px;
border-radius:12px;
margin-top:10px;
}

.item{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
padding:5px 8px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🍝 MONTE SUA MASSA</h1>

<div class="bloco">

<h2>QUANTIDADE</h2>
<label><input type="radio" name="quantidade" value="450G" data-preco="14.90"> 450G - R$14,90</label>
<label><input type="radio" name="quantidade" value="900G" data-preco="27.90"> 900G - R$27,90</label>

<h2>MASSA</h2>
<label><input type="radio" name="massa" value="Espaguete"> Espaguete</label>
<label><input type="radio" name="massa" value="Fettuccine"> Fettuccine</label>
<label><input type="radio" name="massa" value="Penne"> Penne</label>

</div>

<div class="bloco">
<h2>🛒 CARRINHO</h2>
<div id="carrinho"></div>

<button class="botao" onclick="adicionarCarrinho()">➕ ADICIONAR AO CARRINHO</button>
</div>

<button class="botao" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>

</div>

<script>

function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

/* ➕ ADD UNIVERSAL */
function adicionarCarrinho(){

let quantidade=document.querySelector('input[name="quantidade"]:checked');
let massa=document.querySelector('input[name="massa"]:checked');

if(!quantidade || !massa){
alert("Escolha opções");
return;
}

let item={
nome:`🍝 Massa - ${quantidade.value} - ${massa.value}`,
preco:Number(quantidade.dataset.preco || 0)
};

let carrinho=getCarrinho();
carrinho.push(item);

salvarCarrinho(carrinho);
renderCarrinho();

alert("Adicionado!");
}

function renderCarrinho(){

let carrinho=getCarrinho();
let div=document.getElementById("carrinho");

if(carrinho.length===0){
div.innerHTML="Carrinho vazio";
return;
}

div.innerHTML="";

carrinho.forEach((item,i)=>{
div.innerHTML+=`
<div class="item">
<span>${item.nome} - R$ ${item.preco.toFixed(2)}</span>
<button class="remover" onclick="remover(${i})">X</button>
</div>
`;
});
}

function remover(i){
let c=getCarrinho();
c.splice(i,1);
salvarCarrinho(c);
renderCarrinho();
}

/* FINALIZAR UNIVERSAL */
function finalizarPedido(){

let carrinho=getCarrinho();

if(carrinho.length===0){
alert("Carrinho vazio");
return;
}

let texto="🛒 NOVO PEDIDO%0A%0A";
let total=0;

carrinho.forEach(i=>{
texto+=i.nome;

if(i.preco){
texto+=" - R$ "+i.preco.toFixed(2);
total+=i.preco;
}

texto+="%0A";
});

texto+="%0A💰 TOTAL: R$ "+total.toFixed(2);

window.open("https://wa.me/5588999031455?text="+texto,"_blank");
}

window.onload=renderCarrinho;

</script>

</body>
</html></html>
