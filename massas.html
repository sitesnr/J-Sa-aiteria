<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Massas - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
padding:20px;
}

.container{max-width:700px;margin:auto;}

h1,h2{text-align:center;margin:20px 0;color:white;}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
color:white;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
background:rgba(255,255,255,.05);
}

input[type="checkbox"],input[type="radio"]{
width:22px;height:22px;margin-right:10px;accent-color:#00ff4c;
}

/* 🔥 RECIBO ESTILO APP */
#printArea{
display:none;
}

.recibo{
background:white;
border-radius:20px;
padding:20px;
color:#333;
}

.topo{
text-align:center;
}

.topo img{
width:80px;
border-radius:12px;
}

.badge{
font-size:12px;
opacity:0.7;
}

.item{
margin:10px 0;
font-size:14px;
}

.total{
font-size:22px;
text-align:center;
margin-top:15px;
font-weight:bold;
color:#5B178A;
}

.botao{
width:100%;
padding:16px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:10px;
}

.botao.verde{
background:#25D366;
color:white;
}

.botao.roxo{
background:#6A0DAD;
color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>🍝 MONTE SUA MASSA</h1>

<!-- (SEUS CAMPOS IGUAIS) -->
<div class="bloco">
<h2>PASSO 1</h2>
<label><input type="radio" name="camarao" value="Não"> Não sou alérgico</label>
<label><input type="radio" name="camarao" value="Sim"> Adicional de camarão (+R$10)</label>
</div>

<div class="bloco">
<h2>PASSO 2</h2>
<label><input type="radio" name="quantidade" value="450G" data-preco="14.90"> 450G - R$14,90</label>
<label><input type="radio" name="quantidade" value="900G" data-preco="27.90"> 900G - R$27,90</label>
</div>

<div class="bloco">
<h2>PASSO 3</h2>
<label><input type="radio" name="massa" value="Espaguete"> Espaguete</label>
<label><input type="radio" name="massa" value="Fettuccine"> Fettuccine</label>
<label><input type="radio" name="massa" value="Penne"> Penne</label>
<label><input type="radio" name="massa" value="Parafuso"> Parafuso</label>
</div>

<button class="botao" onclick="finalizarPedido()">
FINALIZAR PEDIDO
</button>

<!-- RECIBO -->
<div id="printArea">
  <div class="recibo" id="reciboContent"></div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

let pedidoNumero = Math.floor(Math.random()*9000)+1000;

function finalizarPedido(){

let quantidade=document.querySelector('input[name="quantidade"]:checked');
if(!quantidade){alert("Escolha quantidade");return;}

let massa=document.querySelector('input[name="massa"]:checked');
massa=massa?massa.value:"Não selecionado";

let camarao=document.querySelector('input[name="camarao"]:checked');
camarao=camarao?camarao.value:"Não";

let total=parseFloat(quantidade.dataset.preco);
if(camarao==="Sim") total+=10;

let data = new Date().toLocaleString();

document.getElementById("reciboContent").innerHTML=`
<div class="topo">
<img src="logo.jpg">
<h2>J&S AÇAITERIA</h2>
<div class="badge">Comprovante de Pedido</div>
</div>

<hr>

<div class="item"><b>Nº Pedido:</b> #${pedidoNumero}</div>
<div class="item"><b>Data:</b> ${data}</div>
<div class="item"><b>Quantidade:</b> ${quantidade.value}</div>
<div class="item"><b>Massa:</b> ${massa}</div>
<div class="item"><b>Camarão:</b> ${camarao}</div>

<div class="total">TOTAL: R$ ${total.toFixed(2)}</div>

<button class="botao verde" onclick="enviarWhatsApp()">📲 Enviar no WhatsApp</button>
<button class="botao roxo" onclick="baixarImagem()">📥 Baixar Imagem</button>
`;

window.scrollTo(0,document.body.scrollHeight);
document.getElementById("printArea").style.display="block";
}

function baixarImagem(){
html2canvas(document.querySelector(".recibo")).then(canvas=>{
let link=document.createElement("a");
link.download="pedido.png";
link.href=canvas.toDataURL();
link.click();
});
}

function enviarWhatsApp(){

let numero="5588999031455";

html2canvas(document.querySelector(".recibo")).then(canvas=>{

let img=canvas.toDataURL("image/png");

let link=document.createElement("a");
link.download="pedido.png";
link.href=img;
link.click();

window.open(`https://wa.me/${numero}?text=Novo pedido recebido`, "_blank");
});
}

</script>

</body>
</html>
