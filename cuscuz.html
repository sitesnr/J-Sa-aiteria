<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuscuz - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

h1,h2{
text-align:center;
margin:20px 0;
}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:20px;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

label:has(input:checked){
border:2px solid #00ff4c;
background:rgba(0,255,76,0.08);
}

/* CARRINHO GLOBAL */
#carrinho{
background:rgba(255,255,255,.12);
padding:10px;
border-radius:12px;
margin-top:10px;
}

.item{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
padding:5px 8px;
border-radius:8px;
cursor:pointer;
}

/* TICKET */
.ticket{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
padding:20px;
border-radius:20px;
margin-top:20px;
}

.card{
background:white;
color:#333;
padding:20px;
border-radius:15px;
margin-top:15px;
}

.total{
text-align:center;
font-size:22px;
color:#5B178A;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌽 MONTE SEU CUSCUZ</h1>

<div class="bloco">
<h2>ESCOLHA SEU CUSCUZ</h2>

<label><input type="radio" name="cuscuz" value="Ovo - R$8" data-preco="8"> Ovo</label>
<label><input type="radio" name="cuscuz" value="Calabresa - R$8" data-preco="8"> Calabresa</label>
<label><input type="radio" name="cuscuz" value="Carne Moída - R$8" data-preco="8"> Carne Moída</label>
<label><input type="radio" name="cuscuz" value="Frango - R$8" data-preco="8"> Frango</label>
<label><input type="radio" name="cuscuz" value="Carne de Sol - R$13" data-preco="13"> Carne de Sol</label>

<label><input type="radio" name="cuscuz" value="Ovo + Frango - R$10" data-preco="10"> Ovo + Frango</label>
<label><input type="radio" name="cuscuz" value="Frango + Calabresa - R$10" data-preco="10"> Frango + Calabresa</label>
<label><input type="radio" name="cuscuz" value="Ovo + Carne Moída - R$10" data-preco="10"> Ovo + Carne Moída</label>

<label><input type="radio" name="cuscuz" value="Ovo + Carne Moída + Frango - R$11" data-preco="11"> Ovo + Carne Moída + Frango</label>
<label><input type="radio" name="cuscuz" value="Carne Moída + Frango + Calabresa - R$11" data-preco="11"> Carne Moída + Frango + Calabresa</label>

<label><input type="radio" name="cuscuz" value="Especial 2 - R$8" data-preco="8"> Mussarela, milho, azeitona, orégano, requeijão</label>
<label><input type="radio" name="cuscuz" value="Especial 3 - R$10" data-preco="10"> Calabresa, mussarela, milho, azeitona, orégano, requeijão</label>
<label><input type="radio" name="cuscuz" value="Especial 4 - R$12" data-preco="12"> Carne Moída, mussarela, milho, azeitona, orégano, requeijão</label>
<label><input type="radio" name="cuscuz" value="Especial 5 - R$14" data-preco="14"> Ovo, mussarela, milho, azeitona, orégano, requeijão</label>
<label><input type="radio" name="cuscuz" value="Especial 6 - R$13" data-preco="13"> Frango, mussarela, milho, azeitona, orégano, requeijão</label>
<label><input type="radio" name="cuscuz" value="Especial 7 - R$15" data-preco="15"> Carne de Sol, mussarela, milho, azeitona, orégano, requeijão</label>

</div>

<div class="bloco">
<h2>🛒 CARRINHO GLOBAL</h2>
<div id="carrinho"></div>

<button class="botao" onclick="adicionarCarrinho()">➕ ADICIONAR AO CARRINHO</button>
</div>

<button class="botao" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>

<div id="ticketArea" style="display:none;">
  <div class="ticket">
    <h2 style="text-align:center;">🌽 PEDIDO FINALIZADO</h2>

    <div class="card">
      <div id="conteudoTicket"></div>
      <h2 class="total" id="totalTicket"></h2>
    </div>
  </div>
</div>

</div>

<script>

/* ===== CARRINHO GLOBAL ===== */
function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

/* ADICIONAR */
function adicionarCarrinho(){

let itemEscolhido = document.querySelector('input[name="cuscuz"]:checked');

if(!itemEscolhido){
alert("Escolha um cuscuz");
return;
}

let item = "🌽 Cuscuz - " + itemEscolhido.value;

let carrinho = getCarrinho();
carrinho.push(item);
salvarCarrinho(carrinho);

renderCarrinho();
alert("Adicionado ao carrinho!");
}

/* RENDER CARRINHO GLOBAL */
function renderCarrinho(){

let carrinho = getCarrinho();
let div = document.getElementById("carrinho");

if(carrinho.length === 0){
div.innerHTML = "Carrinho vazio";
return;
}

div.innerHTML = "";

carrinho.forEach((item,index)=>{
div.innerHTML += `
<div class="item">
<span>${item}</span>
<button class="remover" onclick="remover(${index})">X</button>
</div>
`;
});
}

function remover(index){
let carrinho = getCarrinho();
carrinho.splice(index,1);
salvarCarrinho(carrinho);
renderCarrinho();
}

/* FINALIZAR (MOSTRA TODOS OS PRODUTOS DO CARRINHO GLOBAL) */
function finalizarPedido(){

let carrinho = getCarrinho();

if(carrinho.length === 0){
alert("Carrinho vazio");
return;
}

let totalTexto = carrinho.map(i => "• " + i).join("<br>");

document.getElementById("conteudoTicket").innerHTML = `
<h3>SEU PEDIDO:</h3>
${totalTexto}
`;

document.getElementById("totalTicket").innerText = "VERIFIQUE O CARRINHO";

document.getElementById("ticketArea").style.display = "block";
}

window.onload = renderCarrinho;

</script>

</body>
</html></html></html>
