<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuscuz - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{max-width:700px;margin:auto;}

h1,h2{text-align:center;margin:20px 0;}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:20px;
}

.voltar{
display:block;
width:100%;
padding:18px;
margin-top:15px;
text-align:center;
border-radius:12px;
background:white;
color:#5B178A;
font-weight:600;
text-decoration:none;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

label:has(input:checked){
border:2px solid #00ff4c;
background:rgba(0,255,76,0.08);
}

#carrinho{
background:rgba(255,255,255,.12);
padding:10px;
border-radius:12px;
margin-top:10px;
}

.item{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
padding:5px 8px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🌽 MONTE SEU CUSCUZ</h1>

<div class="bloco">
<h2>ESCOLHA SEU CUSCUZ</h2>

<!-- COLUNA 1 -->
<label><input type="radio" name="cuscuz" value="Ovo" data-preco="8"> Ovo — R$ 8</label>
<label><input type="radio" name="cuscuz" value="Calabresa" data-preco="8"> Calabresa — R$ 8</label>
<label><input type="radio" name="cuscuz" value="Carne Moída" data-preco="8"> Carne Moída — R$ 8</label>
<label><input type="radio" name="cuscuz" value="Frango" data-preco="8"> Frango — R$ 8</label>
<label><input type="radio" name="cuscuz" value="Carne de Sol" data-preco="13"> Carne de Sol — R$ 13</label>

<label><input type="radio" name="cuscuz" value="Ovo + Frango" data-preco="10"> Ovo, Frango — R$ 10</label>
<label><input type="radio" name="cuscuz" value="Frango + Calabresa" data-preco="10"> Frango, Calabresa — R$ 10</label>
<label><input type="radio" name="cuscuz" value="Ovo + Carne Moída" data-preco="10"> Ovo, Carne Moída — R$ 10</label>
<label><input type="radio" name="cuscuz" value="Ovo + Carne Moída + Frango" data-preco="11"> Ovo, Carne Moída e Frango — R$ 11</label>
<label><input type="radio" name="cuscuz" value="Carne Moída + Frango + Calabresa" data-preco="11"> Carne Moída, Frango e Calabresa — R$ 11</label>

<!-- COLUNA 2 -->
<label><input type="radio" name="cuscuz" value="Especial 2" data-preco="8"> Mussarela, milho, azeitona, orégano, requeijão — R$ 8</label>
<label><input type="radio" name="cuscuz" value="Especial 3" data-preco="10"> Calabresa, mussarela, milho, azeitona, orégano, requeijão — R$ 10</label>
<label><input type="radio" name="cuscuz" value="Especial 4" data-preco="12"> Carne Moída, mussarela, milho, azeitona, orégano, requeijão — R$ 12</label>
<label><input type="radio" name="cuscuz" value="Especial 5" data-preco="14"> Ovo, mussarela, milho, azeitona, orégano, requeijão — R$ 14</label>
<label><input type="radio" name="cuscuz" value="Especial 6" data-preco="13"> Frango, mussarela, milho, azeitona, orégano, requeijão — R$ 13</label>
<label><input type="radio" name="cuscuz" value="Especial 7" data-preco="15"> Carne de Sol, mussarela, milho, azeitona, orégano, requeijão — R$ 15</label>

</div>

<div class="bloco">
<h2>🛒 CARRINHO</h2>
<div id="carrinho"></div>

<button class="botao" onclick="adicionarCarrinho()">➕ ADICIONAR AO CARRINHO</button>

<button class="botao" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>

<a class="voltar" href="javascript:history.back()">⬅ VOLTAR</a>

</div>

<script>

function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

function adicionarCarrinho(){

let itemEscolhido=document.querySelector('input[name="cuscuz"]:checked');

if(!itemEscolhido){
alert("Escolha um cuscuz");
return;
}

let item={
nome:"🌽 Cuscuz - "+itemEscolhido.value,
preco:Number(itemEscolhido.dataset.preco || 0)
};

let carrinho=getCarrinho();
carrinho.push(item);

salvarCarrinho(carrinho);
renderCarrinho();

alert("Adicionado ao carrinho!");
}

function renderCarrinho(){

let carrinho=getCarrinho();
let div=document.getElementById("carrinho");

if(carrinho.length===0){
div.innerHTML="Carrinho vazio";
return;
}

div.innerHTML="";

carrinho.forEach((item,i)=>{
div.innerHTML+=`
<div class="item">
<span>${item.nome} - R$ ${item.preco.toFixed(2)}</span>
<button class="remover" onclick="remover(${i})">X</button>
</div>
`;
});
}

function remover(i){
let c=getCarrinho();
c.splice(i,1);
salvarCarrinho(c);
renderCarrinho();
}

function finalizarPedido(){

let carrinho = getCarrinho();

if(carrinho.length === 0){
alert("Carrinho vazio");
return;
}

let texto = "🌽 PEDIDO CUSCUZ%0A%0A";
let total = 0;

carrinho.forEach(i=>{
texto += i.nome;
texto += ` - R$ ${i.preco.toFixed(2)}%0A`;
total += i.preco;
});

texto += `%0ATOTAL: R$ ${total.toFixed(2)}`;

window.open(
"https://wa.me/5588999031455?text=" + texto,
"_blank"
);

/* LIMPA O CARRINHO */
localStorage.removeItem("carrinho");
renderCarrinho();

/* DESMARCA TODOS OS CAMPOS */
document.querySelectorAll("input").forEach(input=>{
input.checked = false;
});

/* ATUALIZA A TELA */
renderCarrinho();

alert("Pedido enviado com sucesso!");
}

</script>

</body>
</html></html></html></html></html>
