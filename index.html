.container{

.logo{

text-decoration:none;

border-radius:14px;
font-size:17px;
letter-spacing:1px;

font-family:'Montserrat',sans-serif;
}

.principal{
background:white;
color:#5B178A;
font-weight:600;
}

.secundario{
border:1px solid rgba(255,255,255,.4);
color:white;
}

.botao:hover{
transform:scale(1.03);

.rodape{
margin-top:30px;
font-size:12px;
letter-spacing:3px;
