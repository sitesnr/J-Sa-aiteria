<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Açaí - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{max-width:700px;margin:auto;}

h1,h2{text-align:center;margin:20px 0;}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:20px;
}

input[type="checkbox"],
input[type="radio"]{
width:26px;height:26px;
margin-right:12px;
accent-color:#00ff4c;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

label:has(input:checked){
border:2px solid #00ff4c;
background:rgba(0,255,76,0.08);
}

/* CARRINHO */
#carrinhoBox{
background:rgba(255,255,255,.12);
padding:15px;
border-radius:15px;
margin-top:20px;
}

.itemCarrinho{
display:flex;
justify-content:space-between;
margin:8px 0;
padding:8px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
border-radius:8px;
padding:5px 10px;
cursor:pointer;
}

/* TICKET */
.ticket{
background:white;
color:#333;
padding:20px;
border-radius:15px;
}

.total{
text-align:center;
margin-top:15px;
font-size:22px;
color:#5B178A;
}

.verde{background:#25D366;color:white;}
.roxo{background:#6A0DAD;color:white;}
</style>
</head>

<body>

<div class="container">

<h1>🍧 MONTE SEU AÇAÍ</h1>

<div class="bloco">
<h2>TAMANHOS</h2>
<label><input type="radio" name="tamanho" value="300ml"> 300ml</label>
<label><input type="radio" name="tamanho" value="400ml"> 400ml</label>
<label><input type="radio" name="tamanho" value="500ml"> 500ml</label>
</div>

<div class="bloco">
<h2>BASE</h2>
<label><input type="radio" name="base" value="Tradicional"> Tradicional</label>
</div>

<div class="bloco">
<h2>COMPLEMENTOS</h2>

<label><input type="checkbox" value="Ninho"> Ninho</label>
<label><input type="checkbox" value="Morango"> Morango</label>
<label><input type="checkbox" value="Banana"> Banana</label>
<label><input type="checkbox" value="Granola"> Granola</label>
<label><input type="checkbox" value="Leite em pó"> Leite em pó</label>

</div>

<button class="botao" onclick="adicionarCarrinho()">➕ ADICIONAR AO CARRINHO</button>

<div id="carrinhoBox">
<h2>🛒 CARRINHO</h2>
<div id="carrinho"></div>
</div>

<button class="botao" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>

<div id="ticketArea" style="display:none;">

<div class="ticket" id="ticket">
<h2>🍧 PEDIDO FINALIZADO</h2>
<div id="conteudoTicket"></div>
<h2 class="total" id="totalTicket"></h2>
</div>

<button class="botao verde" onclick="enviarWhatsApp()">📲 WhatsApp</button>
<button class="botao roxo" onclick="baixarImagem()">⬇️ Baixar imagem</button>

</div>

</div>

<script>

/* ================= CARRINHO UNIVERSAL ================= */

function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

/* 🍧 ADICIONAR PADRÃO UNIVERSAL */
function adicionarCarrinho(){

let tamanho=document.querySelector('input[name="tamanho"]:checked');
let base=document.querySelector('input[name="base"]:checked');

if(!tamanho || !base){
alert("Escolha tamanho e base");
return;
}

let ingredientes=[...document.querySelectorAll('input[type="checkbox"]:checked')]
.map(i=>i.value);

let nome = `🍧 Açaí ${tamanho.value} - ${base.value} - ${ingredientes.join(", ")}`;

let item = {
nome: nome,
preco: 0
};

let carrinho = getCarrinho();
carrinho.push(item);

salvarCarrinho(carrinho);
renderCarrinho();

alert("Adicionado ao carrinho!");
}

/* 🛒 RENDER */
function renderCarrinho(){

let carrinho=getCarrinho();
let div=document.getElementById("carrinho");

if(!div) return;

if(carrinho.length===0){
div.innerHTML="Vazio";
return;
}

div.innerHTML="";

carrinho.forEach((item,i)=>{
div.innerHTML+=`
<div class="itemCarrinho">
<span>${item.nome}</span>
<button class="remover" onclick="remover(${i})">X</button>
</div>
`;
});
}

/* ❌ REMOVER */
function remover(i){
let c=getCarrinho();
c.splice(i,1);
salvarCarrinho(c);
renderCarrinho();
}

window.onload=renderCarrinho;

/* 🧾 FINALIZAR UNIVERSAL */
function finalizarPedido(){

let carrinho=getCarrinho();

if(carrinho.length===0){
alert("Carrinho vazio");
return;
}

let texto="🍧 NOVO PEDIDO%0A%0A";

carrinho.forEach(i=>{
texto += i.nome + "%0A";
});

texto += "%0A💰 TOTAL DE ITENS: " + carrinho.length;

window.open(
"https://wa.me/5588999031455?text="+texto,
"_blank"
);
}

/* 📸 IMAGEM */
function baixarImagem(){
html2canvas(document.querySelector("#ticket")).then(canvas=>{
let link=document.createElement("a");
link.download="pedido-acai.png";
link.href=canvas.toDataURL();
link.click();
});
}

</script>

</body>
</html></html></html></html>
