<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Açaí - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{max-width:700px;margin:auto;}

h1,h2{text-align:center;margin:20px 0;}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:20px;
}

input[type="checkbox"],
input[type="radio"]{
width:26px;
height:26px;
margin-right:12px;
accent-color:#00ff4c;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

label:has(input:checked){
border:2px solid #00ff4c;
background:rgba(0,255,76,0.08);
}

.inputValor{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-size:16px;
outline:none;
}

#carrinho{
background:rgba(255,255,255,.12);
padding:10px;
border-radius:12px;
margin-top:10px;
}

.item{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
padding:5px 8px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🍧 MONTE SEU AÇAÍ</h1>

<!-- VALOR PERSONALIZADO -->
<div class="bloco">
<h2>💰 VALOR PERSONALIZADO</h2>
<input id="valorAcai" class="inputValor" type="number" placeholder="Digite o valor do açaí (ex: 12.00)">
</div>

<!-- TAMANHOS -->
<div class="bloco">
<h2>TAMANHOS</h2>
<label><input type="radio" name="tamanho" value="300ml" data-preco="10"> 300ml</label>
<label><input type="radio" name="tamanho" value="400ml" data-preco="13"> 400ml</label>
<label><input type="radio" name="tamanho" value="500ml" data-preco="16"> 500ml</label>
</div>

<!-- BASE -->
<div class="bloco">
<h2>BASE</h2>
<label><input type="radio" name="base" value="Tradicional"> Tradicional</label>
</div>

<!-- CREMES -->
<div class="bloco">
<h2>🍦 CREMES</h2>

<label><input type="checkbox" class="ing" value="Ninho"> Ninho</label>
<label><input type="checkbox" class="ing" value="Cupuaçu"> Cupuaçu</label>
<label><input type="checkbox" class="ing" value="Maracujá"> Maracujá</label>
<label><input type="checkbox" class="ing" value="Pistache"> Pistache</label>

</div>

<!-- COMPLEMENTOS -->
<div class="bloco">
<h2>🍫 COMPLEMENTOS</h2>

<label><input type="checkbox" class="ing" value="Banana"> Banana</label>
<label><input type="checkbox" class="ing" value="Morango"> Morango</label>
<label><input type="checkbox" class="ing" value="Kiwi"> Kiwi</label>

<label><input type="checkbox" class="ing" value="Chocowafer preto"> Chocowafer preto</label>
<label><input type="checkbox" class="ing" value="Chocowafer branco"> Chocowafer branco</label>
<label><input type="checkbox" class="ing" value="Tubetes"> Tubetes</label>
<label><input type="checkbox" class="ing" value="Chocoball"> Chocoball</label>
<label><input type="checkbox" class="ing" value="Jujuba"> Jujuba</label>
<label><input type="checkbox" class="ing" value="Granola"> Granola</label>
<label><input type="checkbox" class="ing" value="Sucrilhos"> Sucrilhos</label>
<label><input type="checkbox" class="ing" value="M&Ms"> M&Ms</label>
<label><input type="checkbox" class="ing" value="Marshmallow"> Marshmallow</label>
<label><input type="checkbox" class="ing" value="Paçoca"> Paçoca</label>
<label><input type="checkbox" class="ing" value="Leite em pó"> Leite em pó</label>
<label><input type="checkbox" class="ing" value="Creme de avelã"> Creme de avelã</label>
<label><input type="checkbox" class="ing" value="Gotas de chocolate"> Gotas de chocolate</label>


</div>

<!-- CARRINHO -->
<div class="bloco">
<h2>🛒 CARRINHO GLOBAL</h2>
<div id="carrinho"></div>

<button class="botao" onclick="adicionarCarrinho()">➕ ADICIONAR AO CARRINHO</button>
<button class="botao" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>
</div>

</div>

<script>

/* CARRINHO GLOBAL */
function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

/* ADICIONAR */
function adicionarCarrinho(){

let tamanho=document.querySelector('input[name="tamanho"]:checked');
let base=document.querySelector('input[name="base"]:checked');
let valor=document.getElementById("valorAcai").value;

if(!tamanho || !base){
alert("Escolha tamanho e base");
return;
}

if(!valor || valor<=0){
alert("Digite o valor do açaí");
return;
}

let ingredientes=[...document.querySelectorAll('.ing:checked')].map(i=>i.value);

let item={
nome:`🍧 Açaí ${tamanho.value} - ${base.value} - ${ingredientes.join(", ")}`,
preco:Number(valor)
};

let carrinho=getCarrinho();
carrinho.push(item);

salvarCarrinho(carrinho);
renderCarrinho();

alert("Adicionado ao carrinho!");
}

/* RENDER */
function renderCarrinho(){

let carrinho=getCarrinho();
let div=document.getElementById("carrinho");

if(carrinho.length===0){
div.innerHTML="Carrinho vazio";
return;
}

div.innerHTML="";

carrinho.forEach((item,i)=>{
div.innerHTML+=`
<div class="item">
<span>${item.nome} - R$ ${item.preco.toFixed(2)}</span>
<button class="remover" onclick="remover(${i})">X</button>
</div>
`;
});
}

/* REMOVER */
function remover(i){
let c=getCarrinho();
c.splice(i,1);
salvarCarrinho(c);
renderCarrinho();
}

/* FINALIZAR */
function finalizarPedido(){

let carrinho=getCarrinho();

if(carrinho.length===0){
alert("Carrinho vazio");
return;
}

let texto="🛒 NOVO PEDIDO%0A%0A";
let total=0;

carrinho.forEach(i=>{
texto+=i.nome;

if(i.preco){
texto+=" - R$ "+i.preco.toFixed(2);
total+=i.preco;
}

texto+="%0A";
});

texto+="%0A💰 TOTAL: R$ "+total.toFixed(2);

window.open("https://wa.me/5588999031455?text="+texto,"_blank");
}

window.onload=renderCarrinho;

</script>

</body>
</html></html></html></html></html></html>
