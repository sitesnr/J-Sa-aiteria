<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Açaí - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

h1,h2{
text-align:center;
margin:20px 0;
}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:20px;
}

input[type="checkbox"],
input[type="radio"]{
width:26px;
height:26px;
margin-right:12px;
cursor:pointer;
accent-color:#00ff4c;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

label:has(input:checked){
border:2px solid #00ff4c;
background:rgba(0,255,76,0.08);
}

.ticket{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
padding:20px;
border-radius:20px;
color:white;
margin-top:20px;
}

.card{
background:white;
color:#333;
border-radius:15px;
padding:20px;
margin-top:15px;
}

.topo{text-align:center;}

.total{
text-align:center;
margin-top:15px;
font-size:22px;
color:#5B178A;
}

.verde{background:#25D366;color:white;margin-top:15px;}
.roxo{background:#6A0DAD;color:white;}

/* 🛒 CARRINHO GLOBAL */
#carrinhoBox{
background:rgba(255,255,255,.12);
padding:15px;
border-radius:15px;
margin-top:20px;
}

.itemCarrinho{
display:flex;
justify-content:space-between;
margin:8px 0;
padding:8px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
border-radius:8px;
padding:5px 10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🍧 MONTE SEU AÇAÍ</h1>

<div class="bloco">
<h2>TAMANHOS</h2>
<label><input type="radio" name="tamanho" value="300ml"> 300ml</label>
<label><input type="radio" name="tamanho" value="400ml"> 400ml</label>
<label><input type="radio" name="tamanho" value="500ml"> 500ml</label>
</div>

<div class="bloco">
<h2>BASE DO AÇAÍ</h2>
<label><input type="radio" name="base" value="Açaí Tradicional"> Tradicional</label>
</div>

<div class="bloco">
<h2>CREMES E COMPLEMENTOS</h2>

<label><input type="checkbox" value="Maracujá"> Creme de Maracujá</label>
<label><input type="checkbox" value="Cupuaçu"> Creme de Cupuaçu</label>
<label><input type="checkbox" value="Ninho"> Creme de Ninho</label>
<label><input type="checkbox" value="Pistache"> Creme de Pistache</label>

<label><input type="checkbox" value="Banana"> Banana</label>
<label><input type="checkbox" value="Morango"> Morango</label>
<label><input type="checkbox" value="Kiwi"> Kiwi</label>

<label><input type="checkbox" value="Chocowafer preto"> Chocowafer preto</label>
<label><input type="checkbox" value="Chocowafer branco"> Chocowafer branco</label>
<label><input type="checkbox" value="Tubetes"> Tubetes</label>
<label><input type="checkbox" value="Chocoball"> Chocoball</label>
<label><input type="checkbox" value="Jujuba"> Jujuba</label>
<label><input type="checkbox" value="Granola tradicional"> Granola tradicional</label>
<label><input type="checkbox" value="Sucrilhos"> Sucrilhos</label>
<label><input type="checkbox" value="MMs pequeno"> MMs pequeno</label>
<label><input type="checkbox" value="Marshmallow"> Marshmallow</label>
<label><input type="checkbox" value="Paçoquita"> Paçoquita</label>
<label><input type="checkbox" value="Leite em pó"> Leite em pó</label>
<label><input type="checkbox" value="Creme de avelã"> Creme de avelã</label>
<label><input type="checkbox" value="Gotas de chocolate"> Gotas de chocolate</label>

</div>

<!-- 🛒 BOTÃO -->
<button class="botao" onclick="adicionarCarrinho()">➕ ADICIONAR AO CARRINHO</button>

<!-- 🛒 CARRINHO -->
<div id="carrinhoBox">
<h2>🛒 CARRINHO GLOBAL</h2>
<div id="carrinho"></div>
</div>

<button class="botao" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>

<div id="ticketArea" style="display:none;">

<div class="ticket">
<h2 style="text-align:center;">🍧 PEDIDO FINALIZADO</h2>

<div class="card">
<div id="conteudoTicket"></div>
<h2 class="total" id="totalTicket"></h2>
</div>

</div>

<button class="botao verde" onclick="enviarWhatsApp()">📲 WhatsApp</button>
<button class="botao roxo" onclick="baixarImagem()">⬇️ Baixar imagem</button>

</div>

</div>

<script>

/* ===== CARRINHO GLOBAL ===== */
function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

function adicionarCarrinho(){

let tamanho=document.querySelector('input[name="tamanho"]:checked');
if(!tamanho){alert("Escolha o tamanho");return;}

let base=document.querySelector('input[name="base"]:checked');
if(!base){alert("Escolha a base");return;}

let ingredientes=[...document.querySelectorAll('input[type="checkbox"]:checked')].map(i=>i.value);

let item = `🍧 Açaí - ${tamanho.value} - ${base.value} - ${ingredientes.join(", ")}`;

let carrinho = getCarrinho();
carrinho.push(item);
salvarCarrinho(carrinho);

renderCarrinho();
alert("Adicionado ao carrinho!");
}

function renderCarrinho(){

let carrinho = getCarrinho();
let div = document.getElementById("carrinho");

if(carrinho.length===0){
div.innerHTML="Carrinho vazio";
return;
}

div.innerHTML="";

carrinho.forEach((item,index)=>{
div.innerHTML+=`
<div class="itemCarrinho">
<span>${item}</span>
<button class="remover" onclick="removerItem(${index})">X</button>
</div>
`;
});
}

function removerItem(index){
let carrinho = getCarrinho();
carrinho.splice(index,1);
salvarCarrinho(carrinho);
renderCarrinho();
}

window.onload = renderCarrinho;

/* ===== FINALIZAR PEDIDO (MOSTRA TODOS OS PRODUTOS DO CARRINHO GLOBAL) ===== */

function finalizarPedido(){

let carrinho = getCarrinho();

if(carrinho.length===0){
alert("Carrinho vazio");
return;
}

document.getElementById("conteudoTicket").innerHTML =
carrinho.map(i => "• " + i).join("<br>");

document.getElementById("totalTicket").innerText =
"TOTAL DE ITENS: " + carrinho.length;

document.getElementById("ticketArea").style.display="block";
}

function enviarWhatsApp(){
let carrinho = getCarrinho();

let texto = "🍧 NOVO PEDIDO AÇAÍ%0A%0A";
texto += carrinho.join("%0A");
texto += "%0A%0ATotal: " + carrinho.length + " itens";

window.open("https://wa.me/5588999031455?text=" + texto,"_blank");
}

function baixarImagem(){
let link=document.createElement("a");
link.href=imagemPedido;
link.download="pedido-acai.png";
link.click();
}

</script>

</body>
</html>
</body>
</html></html></html>
