<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorvetes - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{max-width:700px;margin:auto;}

h1,h2{text-align:center;margin:20px 0;}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:20px;
}

label{
display:flex;
align-items:center;
padding:10px;
margin:8px 0;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

label:has(input:checked){
border:2px solid #00ff4c;
background:rgba(0,255,76,0.08);
}

/* INPUT NOVO */
.inputValor{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-top:10px;
font-size:16px;
outline:none;
}

#carrinho{
background:rgba(255,255,255,.12);
padding:10px;
border-radius:12px;
margin-top:10px;
}

.item{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
padding:5px 8px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🍦 MONTE SEU SORVETE</h1>

<div class="bloco">
<h2>💰 VALOR PERSONALIZADO</h2>
<input id="valorSorvete" class="inputValor" type="number" placeholder="Digite o valor do sorvete (ex: 10.00)">
</div>


<div class="bloco">
<h2>SABORES</h2>

<label><input type="checkbox" class="sabor" value="Morango"> Morango</label>
<label><input type="checkbox" class="sabor" value="Chocolate"> Chocolate</label>
<label><input type="checkbox" class="sabor" value="Menta"> Menta</label>
<label><input type="checkbox" class="sabor" value="Flocos"> Flocos</label>
<label><input type="checkbox" class="sabor" value="Nutella"> Nutella</label>
<label><input type="checkbox" class="sabor" value="Creme com passas"> Creme com passas</label>
<label><input type="checkbox" class="sabor" value="Chiclete"> Chiclete</label>
<label><input type="checkbox" class="sabor" value="Menta com chocolate"> Menta com chocolate</label>

</div>

<div class="bloco">
<h2>🛒 CARRINHO GLOBAL</h2>
<div id="carrinho"></div>

<button class="botao" onclick="adicionarCarrinho()">
➕ ADICIONAR AO CARRINHO
</button>
  
<button class="botao" onclick="finalizarPedido()">
FINALIZAR PEDIDO
</button>
  
</div>

</div>

<script>

/* CARRINHO GLOBAL */
function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvarCarrinho(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

/* ADICIONAR */
function adicionarCarrinho(){

let sabores=[...document.querySelectorAll('.sabor:checked')].map(i=>i.value);
let valor=document.getElementById("valorSorvete").value;

if(sabores.length===0){
alert("Escolha pelo menos 1 sabor");
return;
}

if(!valor || valor<=0){
alert("Digite o valor do sorvete");
return;
}

let item={
nome:"🍦 Sorvete - "+sabores.join(", "),
preco:Number(valor)
};

let carrinho=getCarrinho();
carrinho.push(item);

salvarCarrinho(carrinho);
renderCarrinho();

alert("Adicionado ao carrinho!");
}

/* RENDER */
function renderCarrinho(){

let carrinho=getCarrinho();
let div=document.getElementById("carrinho");

if(carrinho.length===0){
div.innerHTML="Carrinho vazio";
return;
}

div.innerHTML="";

carrinho.forEach((item,i)=>{
div.innerHTML+=`
<div class="item">
<span>${item.nome} - R$ ${item.preco.toFixed(2)}</span>
<button class="remover" onclick="remover(${i})">X</button>
</div>
`;
});
}

/* REMOVER */
function remover(i){
let c=getCarrinho();
c.splice(i,1);
salvarCarrinho(c);
renderCarrinho();
}

/* FINALIZAR */
function finalizarPedido(){

let carrinho=getCarrinho();

if(carrinho.length===0){
alert("Carrinho vazio");
return;
}

let texto="🛒 NOVO PEDIDO%0A%0A";
let total=0;

carrinho.forEach(i=>{
texto+=i.nome;

if(i.preco){
texto+=" - R$ "+i.preco.toFixed(2);
total+=i.preco;
}

texto+="%0A";
});

texto+="%0A💰 TOTAL: R$ "+total.toFixed(2);

window.open(
"https://wa.me/5588999031455?text="+texto,
"_blank"
);

localStorage.removeItem("carrinho");
renderCarrinho();

document.querySelectorAll("input").forEach(input=>{
if(input.type==="checkbox"){
input.checked=false;
}
});

document.getElementById("valorSorvete").value="";

alert("Pedido enviado com sucesso!");
}

window.onload=renderCarrinho;
</script>

</body>
</html>
