<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho - J&S Açaiteria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(135deg,#4B0082,#6A0DAD,#2E8B57);
font-family:'Montserrat',sans-serif;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

h1{
text-align:center;
margin:20px 0;
}

.bloco{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.remover{
background:red;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.total{
text-align:center;
font-size:24px;
margin:20px 0;
color:#fff;
}

.botao{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:white;
color:#5B178A;
font-weight:600;
margin-top:15px;
}

.limpar{
background:#ff3b3b;
color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>🛒 SEU CARRINHO</h1>

<div class="bloco" id="lista"></div>

<h2 class="total" id="total"></h2>

<button class="botao" onclick="finalizar()">📲 FINALIZAR NO WHATSAPP</button>

<button class="botao limpar" onclick="limpar()">🗑 LIMPAR CARRINHO</button>

</div>

<script>

/* ================= CARRINHO GLOBAL ================= */

function getCarrinho(){
return JSON.parse(localStorage.getItem("carrinho")) || [];
}

function salvar(c){
localStorage.setItem("carrinho", JSON.stringify(c));
}

function render(){

let carrinho = getCarrinho();
let div = document.getElementById("lista");

div.innerHTML = "";

if(carrinho.length === 0){
div.innerHTML = "<p style='text-align:center;'>Carrinho vazio</p>";
document.getElementById("total").innerText = "";
return;
}

let total = 0;

carrinho.forEach((item,index)=>{

total += Number(item.preco);

div.innerHTML += `
<div class="item">
<div>
<strong>${item.nome}</strong><br>
R$ ${item.preco.toFixed(2)}
</div>
<button class="remover" onclick="remover(${index})">X</button>
</div>
`;
});

document.getElementById("total").innerText =
"TOTAL: R$ " + total.toFixed(2);

}

function remover(i){
let c = getCarrinho();
c.splice(i,1);
salvar(c);
render();
}

function limpar(){
localStorage.removeItem("carrinho");
render();
}

/* ================= FINALIZAR ================= */

function finalizar(){

let carrinho = getCarrinho();

if(carrinho.length === 0){
alert("Carrinho vazio!");
return;
}

let texto = "NOVO PEDIDO J&S AÇAITERIA\n\n";

let total = 0;

carrinho.forEach(item=>{
texto += "- " + item.nome + " - R$ " + item.preco.toFixed(2) + "\n";
total += Number(item.preco);
});

texto += "\nTOTAL: R$ " + total.toFixed(2);

let numero = "5588999031455";

window.open(
`https://wa.me/${numero}?text=${encodeURIComponent(texto)}`,
"_blank"
);

localStorage.removeItem("carrinho");
render();

alert("Pedido enviado com sucesso!");
}

</script>

</body>
</html>
